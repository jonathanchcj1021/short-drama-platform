# Render 部署設定（免費層）
# 用法：在 Render Dashboard → New → Blueprint，連接 GitHub repo 後自動讀取此檔
# 文件：https://render.com/docs/blueprint-spec

services:
  - type: web
    name: short-drama-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: short-drama-db
          property: connectionString
      - key: REDIS_URL
        sync: false  # 需手動設定：建議用 Upstash 免費 Redis（https://upstash.com）
      - key: JWT_SECRET
        generateValue: true  # Render 自動產生隨機密鑰
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

databases:
  - name: short-drama-db
    databaseName: drama
    user: postgres
    plan: free
    region: oregon
    ipAllowList: []  # 只允許 Render 內部連線
